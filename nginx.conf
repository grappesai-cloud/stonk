server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # fonturile si imaginile nu se schimba, pot sta in cache
  location ~* \.(woff2|jpg|jpeg|png|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  # CSS si JS se schimba la fiecare deploy, deci cache scurt
  location ~* \.(css|js)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  # HTML-ul nu se pune niciodata in cache, altfel raman pagini vechi dupa deploy
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # og.html e doar sablonul pentru imaginea de share, nu e pagina publica
  location = /og.html { return 404; }

  location / {
    try_files $uri $uri/ =404;
  }
}
