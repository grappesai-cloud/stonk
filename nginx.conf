server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # fonturile si imaginile nu se schimba, pot sta in cache
  location ~* \.(woff2|jpg|jpeg|png|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  # CSS si JS se schimba la fiecare deploy, iar numele fisierelor NU contin
  # amprenta continutului. Cu un cache de o ora, dupa deploy omul primeste HTML
  # nou peste JS vechi, adica o pagina care se poarta ciudat fara sa se strice
  # vizibil. Se vede greu si se explica si mai greu.
  #
  # Fisierele sunt de zeci de kiloocteti, deci revalidarea cu ETag costa un
  # 304 si atat. Cache-ul lung se pune inapoi cand vor avea nume cu amprenta.
  location ~* \.(css|js)$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # HTML-ul nu se pune niciodata in cache, altfel raman pagini vechi dupa deploy
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # og.html e doar sablonul pentru imaginea de share, nu e pagina publica
  location = /og.html { return 404; }

  # Cifrele reale, luate de la agentul care chiar ruleaza pe aceeasi masina.
  #
  # Merge prin nginx-ul paginii dinadins: acelasi domeniu, deci fara CORS, si
  # mai ales fara sa scoatem agentul in internet. Adresa de mai jos e puntea
  # docker catre gazda; agentul asculta acolo, nu pe IP-ul public.
  # Daca nu raspunde, pagina ramane pe cifrele ei statice, nu se strica.
  location = /api/stats {
    proxy_pass http://10.0.0.1:8798/site;
    proxy_connect_timeout 2s;
    proxy_read_timeout 4s;
    add_header Cache-Control "no-store";
  }

  # Formularul de whitelist. Merge la serviciul nostru, pe aceeasi masina, nu
  # la un serviciu de formulare la altcineva: fara cont, fara cheie, si lista
  # ramane la noi. Corpul e plafonat si aici, nu doar in serviciu.
  location = /api/whitelist {
    client_max_body_size 4k;
    proxy_pass http://10.0.0.1:8802/;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
